<!doctype html>
<!--
  The disk image background, drawn in a browser so type and gradients come out
  the way they do in the app. scripts/generate-dmg-background.py renders it to
  icons/dmg-background.png and @2x.

  The window is 660x400 with the 128pt app icon centred on (180, 170) and
  Applications on (480, 170), matching bundle.macOS.dmg in tauri.conf.json and
  finish-dmg.sh. Finder draws the icons and their names on top; this only draws
  what is between and around them.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 660px; height: 400px; overflow: hidden; }
  body {
    position: relative;
    font-family: -apple-system, "SF Pro Text", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    background: linear-gradient(160deg, #ffffff 0%, #f5f4f1 55%, #ece9e2 100%);
  }
  /* A soft blue band behind both icons, fading out at every edge. */
  .band {
    position: absolute; left: 0; right: 0; top: 64px; height: 244px;
    background: radial-gradient(closest-side, rgba(50, 132, 208, 0.09), rgba(50, 132, 208, 0) 100%);
    transform: scaleX(1.6);
  }
  .brand {
    position: absolute; top: 26px; width: 100%;
    display: flex; justify-content: center; align-items: center; gap: 8px;
    font-size: 14px; font-weight: 600; color: #2b2a27; letter-spacing: -0.01em;
  }
  .brand svg { width: 22px; height: 22px; }
  .wave { position: absolute; left: 0; top: 0; fill: #3284d0; }
  p {
    position: absolute; bottom: 28px; width: 100%; text-align: center;
    font-size: 12px; color: #7d7a72;
  }
  p b { color: #3284d0; font-weight: 600; }
</style>
</head>
<body>
  <div class="band"></div>
  <div class="brand">
    <svg viewBox="0 0 100 100" fill="#2b2a27">
      <rect x="17.20" y="35.55" width="7.81" height="28.90" rx="3.91"/>
      <rect x="31.64" y="24.20" width="7.81" height="51.60" rx="3.91"/>
      <rect x="46.09" y="35.55" width="7.81" height="28.90" rx="3.91" fill="#3284d0"/>
      <rect x="60.55" y="24.20" width="7.81" height="51.60" rx="3.91"/>
      <rect x="75.00" y="35.55" width="7.81" height="28.90" rx="3.91"/>
    </svg>
    Waveform
  </div>
  <!-- The arrow: a sound wave that grows and brightens towards Applications. -->
  <svg class="wave" width="660" height="400">
    <rect x="258.0" y="166.0" width="3.6" height="8.0" rx="1.8" fill-opacity="0.25"/>
    <rect x="265.6" y="163.3" width="3.6" height="13.5" rx="1.8" fill-opacity="0.29"/>
    <rect x="273.2" y="159.0" width="3.6" height="22.0" rx="1.8" fill-opacity="0.33"/>
    <rect x="280.8" y="156.1" width="3.6" height="27.7" rx="1.8" fill-opacity="0.38"/>
    <rect x="288.4" y="156.7" width="3.6" height="26.6" rx="1.8" fill-opacity="0.42"/>
    <rect x="296.0" y="161.1" width="3.6" height="17.8" rx="1.8" fill-opacity="0.46"/>
    <rect x="303.6" y="163.8" width="3.6" height="12.3" rx="1.8" fill-opacity="0.50"/>
    <rect x="311.2" y="156.6" width="3.6" height="26.8" rx="1.8" fill-opacity="0.54"/>
    <rect x="318.8" y="151.9" width="3.6" height="36.3" rx="1.8" fill-opacity="0.58"/>
    <rect x="326.4" y="151.4" width="3.6" height="37.2" rx="1.8" fill-opacity="0.62"/>
    <rect x="334.0" y="155.5" width="3.6" height="29.0" rx="1.8" fill-opacity="0.67"/>
    <rect x="341.6" y="162.7" width="3.6" height="14.7" rx="1.8" fill-opacity="0.71"/>
    <rect x="349.2" y="161.7" width="3.6" height="16.6" rx="1.8" fill-opacity="0.75"/>
    <rect x="356.8" y="156.3" width="3.6" height="27.5" rx="1.8" fill-opacity="0.79"/>
    <rect x="364.4" y="154.6" width="3.6" height="30.7" rx="1.8" fill-opacity="0.83"/>
    <rect x="372.0" y="156.9" width="3.6" height="26.3" rx="1.8" fill-opacity="0.88"/>
    <rect x="379.6" y="161.4" width="3.6" height="17.2" rx="1.8" fill-opacity="0.92"/>
    <rect x="387.2" y="165.6" width="3.6" height="8.8" rx="1.8" fill-opacity="0.96"/>
    <rect x="394.8" y="166.0" width="3.6" height="8.0" rx="1.8" fill-opacity="1.00"/>
    <path d="M402 162 L410 170 L402 178" fill="none" stroke="#3284d0" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <p>Drag the app onto <b>Applications</b> to install</p>
</body>
</html>
