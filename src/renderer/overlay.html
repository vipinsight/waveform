<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Waveform listening</title>
        <!--
      Icons are Lucide (ISC), inlined rather than loaded so the window has
      nothing to fetch. Each carries `data-icon` with its name at
      https://lucide.dev/icons, and the exact source is pinned by the
      lucide-static devDependency.
    -->
    <link rel="stylesheet" href="./overlay.css" />
  </head>
  <body>
    <div id="hud" class="hud" data-state="idle" data-mode="hold" data-busy="false" tabindex="0" role="group" aria-label="Dictation controls">
      <div id="hud-hint" class="hud-hint" aria-hidden="true">
        <span>Dictate</span>
        <b id="hud-hint-key" class="hud-hint-key">Fn</b>
        <span id="hud-hint-arrow" class="hud-hint-arrow">→</span>
      </div>

      <button id="hud-mic" class="hud-mic" type="button" aria-label="Start dictation">
        <svg data-icon="mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 19v3" />
          <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
          <rect x="9" y="2" width="6" height="13" rx="3" />
        </svg>
      </button>

      <div class="hud-tip hud-tip-cancel" aria-hidden="true">Cancel</div>
      <div class="hud-tip hud-tip-accept" aria-hidden="true">Finish and Paste</div>

      <div class="hud-shine" aria-hidden="true"></div>

      <div class="hud-sparkles" aria-hidden="true">
        <svg class="hud-spark hud-spark-a" viewBox="0 0 16 16">
          <path d="M8 0 9.15 6.85 16 8 9.15 9.15 8 16 6.85 9.15 0 8 6.85 6.85Z" />
        </svg>
        <svg class="hud-spark hud-spark-b" viewBox="0 0 16 16">
          <path d="M8 0 9.15 6.85 16 8 9.15 9.15 8 16 6.85 9.15 0 8 6.85 6.85Z" />
        </svg>
        <svg class="hud-spark hud-spark-c" viewBox="0 0 16 16">
          <path d="M8 0 9.15 6.85 16 8 9.15 9.15 8 16 6.85 9.15 0 8 6.85 6.85Z" />
        </svg>
        <svg class="hud-spark hud-spark-d" viewBox="0 0 16 16">
          <path d="M8 0 9.15 6.85 16 8 9.15 9.15 8 16 6.85 9.15 0 8 6.85 6.85Z" />
        </svg>
        <svg class="hud-spark hud-spark-e" viewBox="0 0 16 16">
          <path d="M8 0 9.15 6.85 16 8 9.15 9.15 8 16 6.85 9.15 0 8 6.85 6.85Z" />
        </svg>
      </div>

      <div class="hud-wait" aria-hidden="true">
        <svg class="hud-spinner" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle class="hud-spinner-track" cx="12" cy="12" r="8" />
          <circle class="hud-spinner-head" cx="12" cy="12" r="8" />
        </svg>
      </div>

      <div class="hud-session">
        <button id="hud-cancel" class="hud-cancel" type="button" aria-label="Cancel">
          <svg data-icon="x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </svg>
        </button>

        <canvas id="wave" class="wave" width="240" height="80"></canvas>

        <button id="hud-accept" class="hud-accept" type="button" aria-label="Accept dictation">
          <svg data-icon="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 6 9 17l-5-5" />
          </svg>
        </button>
      </div>
    </div>
    <span id="hud-label" class="visually-hidden" aria-live="polite">Idle</span>
    <script src="./overlay.js"></script>
  </body>
</html>
