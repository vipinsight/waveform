<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Waveform listening</title>
    <link rel="stylesheet" href="./overlay.css" />
  </head>
  <body>
    <div id="hud" class="hud" data-state="idle" title="Drag to move">
      <button id="hud-cancel" class="hud-cancel" type="button" aria-label="Cancel">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M5 5l6 6M11 5l-6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>

      <canvas id="wave" class="wave" width="240" height="80"></canvas>

      <button id="hud-polish" class="hud-polish" type="button" aria-label="Polish and insert">
        <span class="polish-mark" aria-hidden="true">
          <i></i><i></i><i></i>
        </span>
      </button>
    </div>
    <span id="hud-label" class="visually-hidden" aria-live="polite">Idle</span>
    <script src="./overlay.js"></script>
  </body>
</html>
