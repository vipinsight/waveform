[package]
name = "waveform"
version = "0.4.0"
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "waveform_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Tauri decides "dev" from the absence of this feature, not from the Cargo
# profile (see tauri/build.rs: `let dev = !custom_protocol`). In a dev build it
# calls setApplicationIconImage at startup with the embedded icon, which
# replaces the Dock's rendering of the bundle icon -- no Dock shadow, drawn
# edge to edge, so the icon looks flat and a size larger as soon as launching
# finishes. Enabling it here also means assets are served the same way in every
# build we make, rather than differing between our debug and release output.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Published builds. Drops the compiled-in path to this checkout; see
# project_root() in src/lib.rs. scripts/release.sh turns it on.
dist = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
# Reaches AppKit directly to make the HUD a non-activating panel; see panel.rs.
objc2 = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
# Checks a downloaded weight file before it is moved into place.
sha2 = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
tokio = { version = "1", features = ["fs", "process", "io-util", "time", "sync", "rt-multi-thread", "macros", "signal"] }
# Input-only HAL capture. An AudioContext in the webview attaches to the
# speakers, which is what makes Music hitch when the mic opens.
cpal = "0.15"
# whisper.cpp, linked in rather than run as a subprocess. The metal feature
# also embeds the GGML Metal library into the binary, so a bundled .app has no
# shader file to lose.
whisper-rs = { version = "0.16", default-features = false, features = ["metal"] }
# llama.cpp, linked in beside whisper.cpp and for the same reason: the local
# polish model is then one file the app can fetch, with no runtime to install.
# Both crates vendor ggml; they share one Metal build in the final binary.
llama-cpp-2 = { version = "0.1.156", default-features = false, features = ["metal"] }
# llama.cpp hands back tokens, not characters, and a multi-byte character can
# arrive split across two of them. This is the decoder its own API takes.
encoding_rs = "0.8"
tauri-plugin-updater = "2"
