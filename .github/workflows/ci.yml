name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: macOS checks
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Rust and native build tools
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          command -v cmake >/dev/null || brew install cmake
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build frontend and Swift helper
        run: |
          pnpm build
          test -x dist/native/waveform-hotkey
      - name: TypeScript tests
        run: pnpm test:ui
      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Release orchestration tests (no signing or upload)
        run: pnpm test:release
      - name: Check version consistency
        run: python3 scripts/check-version.py
      - name: Check tracked files stayed unchanged
        run: git diff --exit-code
